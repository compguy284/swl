# Mouse bindings
[[bind.mouse]]
mods = ["mod"]
button = "left"
action = "moveresize"
arg = "move"

[[bind.mouse]]
mods = ["mod"]
button = "middle"
action = "togglefloating"

[[bind.mouse]]
mods = ["mod"]
button = "right"
action = "moveresize"
arg = "resize"
