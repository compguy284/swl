# swl default configuration
# Copy to ~/.config/swl/config.toml and customize.
# Values not present in this file will use built-in defaults.

[general]
sloppy_focus = true
bypass_surface_visibility = false
# lid_close_cmd = ["swaylock", "-f"]

[appearance]
border_width = 1
root_color = "0x222222ff"
border_color = "0x444444ff"
focus_color = "0x005577ff"
urgent_color = "0xff0000ff"
fullscreen_bg = "0x000000ff"

[keyboard]
repeat_rate = 25
repeat_delay = 600
numlock = false
# XKB rule names (uncomment to customize):
# rules = ""
# model = ""
# layout = "us"
# variant = ""
# options = ""

[trackpad]
tap_to_click = true
tap_and_drag = true
drag_lock = true
natural_scrolling = false
disable_while_typing = true
left_handed = false
middle_button_emulation = false
scroll_method = "two_finger"
click_method = "button_areas"
accel_profile = "adaptive"
accel_speed = 0.0
button_map = "lrm"
send_events = "enabled"

[effects]
corner_radius = 0
opacity = 1.0

[effects.shadow]
enabled = false
sigma = 20.0
color = "0x00000099"

[effects.blur]
enabled = false
num_passes = 2
radius = 5
noise = 0.02
brightness = 1.0
contrast = 1.0
saturation = 1.0

[commands]
mod_key = "alt"
terminal = ["foot"]
menu = ["wmenu-run"]

[[monitor]]
scale = 1.0
transform = "normal"

[scroller]
default_column_width = 0.5
preset_column_widths = [0.5, 0.67, 1.0]
center_focused_column = "never"
always_center_single_column = false
gap = 0

# Window rules (examples, commented out):
# [[rule]]
# app_id = "Gimp"
# floating = true

# Key bindings
# Modifier names: "mod" (resolves to mod_key), "shift", "ctrl", "alt", "super"
# Key names: XKB keysym names (e.g., "p", "Return", "space", "Tab")

[[bind.key]]
mods = ["mod"]
key = "p"
action = "spawn"
arg = "menu"

[[bind.key]]
mods = ["mod", "shift"]
key = "Return"
action = "spawn"
arg = "terminal"

[[bind.key]]
mods = ["mod"]
key = "j"
action = "focusstack"
arg = "1"

[[bind.key]]
mods = ["mod"]
key = "k"
action = "focusstack"
arg = "-1"

[[bind.key]]
mods = ["mod", "shift"]
key = "c"
action = "killclient"

[[bind.key]]
mods = ["mod"]
key = "bracketright"
action = "scroller_cycle_width"
arg = "1"

[[bind.key]]
mods = ["mod"]
key = "bracketleft"
action = "scroller_cycle_width"
arg = "-1"

[[bind.key]]
mods = ["mod", "shift"]
key = "space"
action = "togglefloating"

[[bind.key]]
mods = ["mod"]
key = "e"
action = "togglefullscreen"

[[bind.key]]
mods = ["mod"]
key = "comma"
action = "focusmon"
arg = "left"

[[bind.key]]
mods = ["mod"]
key = "period"
action = "focusmon"
arg = "right"

[[bind.key]]
mods = ["mod", "shift"]
key = "less"
action = "tagmon"
arg = "left"

[[bind.key]]
mods = ["mod", "shift"]
key = "greater"
action = "tagmon"
arg = "right"

[[bind.key]]
mods = ["mod"]
key = "i"
action = "consume_or_expel"
arg = "left"

[[bind.key]]
mods = ["mod"]
key = "o"
action = "consume_or_expel"
arg = "right"

[[bind.key]]
mods = ["mod"]
key = "Left"
action = "focusdir"
arg = "left"

[[bind.key]]
mods = ["mod"]
key = "Right"
action = "focusdir"
arg = "right"

[[bind.key]]
mods = ["mod"]
key = "Up"
action = "focusdir"
arg = "up"

[[bind.key]]
mods = ["mod"]
key = "Down"
action = "focusdir"
arg = "down"

[[bind.key]]
mods = ["mod", "shift"]
key = "Left"
action = "swapdir"
arg = "left"

[[bind.key]]
mods = ["mod", "shift"]
key = "Right"
action = "swapdir"
arg = "right"

[[bind.key]]
mods = ["mod", "shift"]
key = "Up"
action = "swapdir"
arg = "up"

[[bind.key]]
mods = ["mod", "shift"]
key = "Down"
action = "swapdir"
arg = "down"

[[bind.key]]
mods = ["mod", "shift"]
key = "q"
action = "quit"

# Note: CHVT bindings (Ctrl+Alt+F1-F12) and Ctrl+Alt+Backspace -> quit
# are auto-generated.

